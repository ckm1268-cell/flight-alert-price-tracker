name: Price monitor
on:
  schedule:
    - cron: '*/10 * * * *'   # best-effort (GitHub may delay runs under load); see README for optional external cron via workflow_dispatch
  workflow_dispatch:
concurrency:
  group: monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Run unit tests first (fail fast)
        run: node --test tests/*.test.js
      - name: Install Playwright only if the scraped source is enabled
        run: |
          if grep -q '"enabled": true' config/websites/scraped_ota.json; then
            npm i --no-save playwright && npx playwright install --with-deps chromium
          fi
      - name: Check prices and send alerts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
        run: node backend/scheduler/run.js
